<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tjoepbiljart: verkeerde tafel</title>
    <meta name="robots" content="noindex" />
    <!-- this page can show up at any depth, so it carries its own few styles and no files -->
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: #e9d9b0;
        color: #1f150e;
        font:
          400 17px/1.6 Merriweather,
          Georgia,
          serif;
      }
      main {
        max-width: 34rem;
        padding: 34px 28px;
        border: 2px solid #1f150e;
        box-shadow:
          inset 0 0 0 5px #f1e5c8,
          inset 0 0 0 7px #1f150e,
          10px 10px 0 rgba(0, 0, 0, 0.35);
        background: #f4e9cf;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font:
          400 clamp(40px, 9vw, 64px) / 1 "Abril Fatface",
          Georgia,
          serif;
        color: #a52a1e;
      }
      p {
        margin: 0 0 12px;
      }
      .en {
        font-style: italic;
        color: #4b3826;
      }
      a {
        display: inline-block;
        margin-top: 10px;
        padding: 12px 22px;
        border: 2px solid #1f150e;
        box-shadow: 4px 4px 0 #1f150e;
        background: #a52a1e;
        color: #f6ecd4;
        font:
          700 14px/1 system-ui,
          sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
      }
      a:hover {
        background: #8f2418;
        translate: -2px -2px;
        box-shadow: 6px 6px 0 #1f150e;
      }
      a:focus-visible {
        outline: 3px solid #1f150e;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Verkeerde tafel</h1>
      <p>Deze pagina bestaat niet. De bal ligt ergens anders.</p>
      <p class="en" lang="en">Wrong table: this page doesn't exist.</p>
      <a href="./">Naar het café <span lang="en">/ To the café</span></a>
    </main>
  </body>
</html>
