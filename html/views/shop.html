<div class="c-view" data-view="shop" hidden>
  <h2 class="c-view__title">The Shop</h2>
  <div class="c-shop c-view__body">
    <div class="c-shop__head">
      <div class="c-tabs c-tabs--many c-shop__tabs" role="tablist" aria-label="Shop" id="shopTabs"></div>
      <span class="c-wallet" id="wallet"
        ><svg class="o-icon"><use href="#i-coin" /></svg><b id="walletNum">0</b><span>tokens</span></span
      >
    </div>
    <div class="c-shop__grid" id="shopGrid" role="list"></div>
    <p class="c-shop__note">
      Looks only: nothing here changes how the balls roll. Win matches for tokens. Gold-edged items can't be bought:
      earn them in freeplay. Your table and bar are your home: the start screen, two-player and online games. Regulars
      play in their own bar, on their own table.
    </p>
  </div>
  <div class="o-row o-row--foot">
    <button class="c-btn c-btn--ghost" type="button" data-go="home">
      <span class="c-btn__label">Back</span>
    </button>
  </div>
</div>
