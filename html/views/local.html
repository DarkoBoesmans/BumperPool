<div class="c-view" data-view="local" hidden>
  <h2 class="c-view__title">Two players</h2>
  <label class="c-field"
    ><span class="c-field__label">Player 1 · white in game 1</span
    ><input class="c-field__input" id="n0" placeholder="Player 1" maxlength="20" data-enter="#btnPlayLocal"
  /></label>
  <label class="c-field"
    ><span class="c-field__label">Player 2 · red in game 1</span
    ><input class="c-field__input" id="n1" placeholder="Player 2" maxlength="20" data-enter="#btnPlayLocal"
  /></label>
  <p class="c-note c-note--center" id="homeBarNote"></p>
  <div class="o-row o-row--foot">
    <button class="c-btn c-btn--ghost" type="button" data-go="home">
      <span class="c-btn__label">Back</span>
    </button>
    <span class="u-grow"></span>
    <button class="c-btn c-btn--cta" type="button" id="btnPlayLocal">
      <span class="c-btn__label">Rack them up</span>
    </button>
  </div>
</div>
