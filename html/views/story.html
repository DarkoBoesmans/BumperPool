<div class="c-view" data-view="story" hidden>
  <h2 class="c-view__title">The Newcomer</h2>
  <div class="c-story c-view__body">
    <div class="c-story__main">
      <div class="c-story__chapters" id="chapters" role="tablist" aria-label="Chapters"></div>
      <article class="c-chapter" id="chapter" aria-live="polite"></article>
    </div>
    <aside class="c-story__side">
      <div class="c-counter">
        <span class="c-counter__num"><b id="beatenNum">0</b><i>/</i><span id="beatenTotal">18</span></span>
        <span class="c-counter__label">regulars beaten</span>
        <span class="c-counter__pips" id="beatenPips"></span>
      </div>
      <div class="c-stats" id="stats"></div>
    </aside>
  </div>
  <div class="o-row o-row--foot">
    <button class="c-btn c-btn--ghost" type="button" data-go="home">
      <span class="c-btn__label">Back</span>
    </button>
    <span class="u-grow"></span>
    <button class="c-btn c-btn--cta" type="button" id="btnStory">
      <span class="c-btn__label">Play</span>
    </button>
  </div>
</div>
