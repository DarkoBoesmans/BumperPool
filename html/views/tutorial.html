<div class="c-view" data-view="tutorial" hidden>
  <h2 class="c-view__title" id="tutTitle">How to play</h2>
  <canvas class="c-tutorial__canvas" id="tutCanvas" width="920" height="520" aria-hidden="true"></canvas>
  <p class="c-tutorial__text" id="tutText"></p>
  <p class="c-tutorial__why" id="tutWhy"></p>
  <div class="c-tutorial__progress">
    <span class="c-tutorial__dots" id="tutDots"></span><span class="c-tutorial__step" id="tutStep">1 / 12</span>
  </div>
  <div class="o-row o-row--foot">
    <button class="c-btn c-btn--ghost" type="button" id="tutSkip">
      <span class="c-btn__label">Skip</span>
    </button>
    <span class="u-grow"></span>
    <button class="c-btn" type="button" id="tutBack"><span class="c-btn__label">Back</span></button>
    <button class="c-btn c-btn--cta" type="button" id="tutNext">
      <span class="c-btn__label">Next</span>
    </button>
  </div>
</div>
