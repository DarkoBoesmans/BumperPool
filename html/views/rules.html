<div class="c-view" data-view="rules" hidden>
  <h2 class="c-view__title">House rules</h2>
  <div class="c-house c-view__body">
    <p class="c-house__note">
      Freeplay only: the story always plays by the rulebook. A match with house rules is a friendly: no tokens, nothing
      on your record.
    </p>
    <div class="c-seg c-seg--3" role="radiogroup" aria-label="Match length" id="ruleGames">
      <button class="c-seg__opt" type="button" role="radio" data-games="1">One game</button>
      <button class="c-seg__opt" type="button" role="radio" data-games="3">Best of three</button>
      <button class="c-seg__opt" type="button" role="radio" data-games="5">Best of five</button>
    </div>
    <div class="c-house__list" id="ruleList"></div>
  </div>
  <div class="o-row o-row--foot">
    <button class="c-btn c-btn--ghost" type="button" id="ruleBook">
      <span class="c-btn__label">Back to the book</span>
    </button>
    <span class="u-grow"></span>
    <button class="c-btn c-btn--cta" type="button" data-go="pick">
      <span class="c-btn__label">Done</span>
    </button>
  </div>
</div>
