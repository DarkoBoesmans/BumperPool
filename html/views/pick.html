<div class="c-view" data-view="pick" hidden>
  <h2 class="c-view__title">Freeplay</h2>
  <div class="c-pick c-view__body">
    <div class="c-pick__left">
      <div class="c-grade-tabs" id="gradeTabs" role="tablist" aria-label="Grade"></div>
      <div class="c-roster" id="roster" role="radiogroup" aria-label="Opponent"></div>
    </div>
    <aside class="c-bio" id="oppBio" aria-live="polite"></aside>
  </div>
  <div class="o-row o-row--foot">
    <button class="c-as" type="button" data-go="me" id="playingAs">Your player</button>
    <button class="c-btn c-btn--ghost" type="button" data-go="rules" id="btnRules">
      <span class="c-btn__label">House rules</span>
    </button>
    <span class="u-grow"></span>
    <button class="c-btn c-btn--ghost" type="button" data-go="home">
      <span class="c-btn__label">Back</span>
    </button>
    <button class="c-btn c-btn--cta" type="button" id="btnChallenge">
      <span class="c-btn__label">Rematch</span>
    </button>
  </div>
</div>
