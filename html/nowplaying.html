<!-- the jukebox's title strip: slides in for a few seconds whenever a new record starts -->
<aside class="c-nowplaying" id="nowPlaying" aria-label="Now playing" hidden>
  <span class="c-nowplaying__label"
    ><svg class="o-icon c-nowplaying__icon" aria-hidden="true"><use href="#i-note" /></svg>Now playing</span
  >
  <b class="c-nowplaying__title" id="npTitle" translate="no"></b>
  <small class="c-nowplaying__info" id="npInfo"></small>
</aside>
