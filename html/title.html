<!-- the title screen: the first press is also the one the browser waits for before the café may make a sound -->
<div class="c-title" id="title">
  <div class="c-title__stack">
    <p class="c-title__logo" translate="no" aria-hidden="true">Tjoepbiljart</p>
    <p class="c-title__ribbon">The Golden Cue Championship</p>
    <button class="c-title__start" type="button" id="pressStart">Press start</button>
    <p class="c-title__hint">Any key, click or tap. Sound on.</p>
  </div>
  <p class="c-title__foot"><span translate="no">Tjoepbiljart</span> v%VERSION%</p>
</div>
