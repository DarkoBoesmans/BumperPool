# Once a month: one pull request for the GitHub Actions, one for the dev tools. three.js stays on r128 on purpose.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: three
      - dependency-name: "@types/three"
      # TypeScript 7 has no compiler API yet, and tools/i18n-keys.ts reads the code with it: stay on 5.x until it does
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dev-tools:
        patterns: ["*"]
