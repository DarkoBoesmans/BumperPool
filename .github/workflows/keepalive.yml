# Keeps the online cafés open: Supabase pauses a free project after a quiet week, and the cafés themselves (Realtime)
# don't count as database activity. One small call a day does. Nothing is read or written: rpc/ping returns "pong".
# GitHub stops scheduled runs in a repository without commits for 60 days; any push starts them again.
name: Keep the online cafés awake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Knock on the door
        run: >-
          curl -fsS -X POST "https://fikiiwkgyiljsnxcaagj.supabase.co/rest/v1/rpc/ping"
          -H "apikey: sb_publishable_7DKiv70Ilo_RMlgxzncVDg_uc_GbCax"
          -H "Content-Type: application/json" -d "{}"
